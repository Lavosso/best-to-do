<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2117">
  <title>Mine-larp · Dziennik misji</title>
  <link rel="stylesheet" href="/ui/style.css">
  <script type="module" src="/ui/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap bar-inner brand">Mine<span>-larp</span></div>
  </header>

  <main class="wrap journal">
    <h1>Dziennik misji</h1>

    <div class="meters">
      <section class="panel experience" aria-labelledby="experience-title">
        <h2 id="experience-title">Rozwój</h2>
        <div class="meter-label"><span class="level">Poziom <b id="level">—</b></span><strong id="level-xp">— XP</strong></div>
        <progress id="level-bar" value="0" max="100" aria-label="Postęp poziomu"></progress>
        <p class="level-up" id="level-up" role="status" aria-atomic="true"></p>
      </section>

      <section class="panel caffeine" id="caffeine" data-level="normal" aria-labelledby="caffeine-title">
        <div class="meter-label">
          <h2 id="caffeine-title">Kofeina</h2>
          <span class="caffeine-values"><strong id="caffeine-mg">— mg</strong><span>Mnożnik XP <b id="multiplier">—</b></span></span>
        </div>
        <meter id="caffeine-bar" value="0" min="0" max="1000" aria-label="Stężenie kofeiny"></meter>
        <p class="caffeine-note" id="caffeine-note" role="status" hidden></p>
        <form id="caffeine-form" autocomplete="off">
          <label>Dawka (mg) <input name="mg" type="number" min="1" max="9007199254740991" step="1" required></label>
          <button type="submit">Wypiłem!</button>
        </form>
      </section>
    </div>

    <div class="classroom-photo"><img src="/ui/assets/monster-school-zombie.jpg" width="736" height="602" alt=""></div>

    <section class="panel board" aria-labelledby="board-title">
      <div class="board-header">
        <h2 id="board-title">Tablica misji</h2>
        <button id="add" class="primary" type="button"><span aria-hidden="true">+</span> Nowa misja</button>
      </div>
      <div class="board-controls">
        <div class="filters" role="group" aria-label="Status misji">
          <button type="button" data-filter="active" aria-pressed="true">Aktywne</button>
          <button type="button" data-filter="done" aria-pressed="false">Ukończone</button>
        </div>
        <div class="select-filters">
          <select id="priority-order" aria-label="Sortuj według priorytetu">
            <option value="desc">Najpilniejsze</option>
            <option value="asc">Najmniej pilne</option>
          </select>
          <select id="tag-filter" aria-label="Filtruj według tagu" hidden><option value="">Wszystkie tagi</option></select>
        </div>
      </div>
      <div id="notice" role="alert" hidden></div>
      <ul id="tasks" aria-label="Misje"></ul>
      <p class="empty" id="empty" role="status">Pobieranie misji…</p>
    </section>
  </main>

  <template id="task-row">
    <li>
      <input type="checkbox">
      <div class="task-body">
        <h3></h3>
        <p></p>
        <div class="metadata"><span class="priority"></span></div>
      </div>
      <span class="task-xp"></span>
    </li>
  </template>

  <dialog id="editor" aria-labelledby="form-title">
    <form id="task-form">
      <h2 id="form-title">Nowa misja</h2>
      <label>Nazwa misji<input name="tytul" required autofocus pattern="\s*\S[\s\S]*" title="Wpisz nazwę misji."></label>
      <label>Opis <small>(opcjonalnie)</small><textarea name="opis" rows="3"></textarea></label>
      <div class="fields"><label>Priorytet<select name="priorytet"></select></label>
      <label>Termin <small>(opcjonalnie)</small><input type="date" name="termin"></label></div>
      <label>Tagi <small>(oddziel przecinkami)</small><input name="tagi" type="text"></label>
      <p id="form-error" role="alert" hidden></p>
      <div class="actions"><button type="button" id="cancel">Anuluj</button><button class="primary" type="submit">Dodaj misję</button></div>
    </form>
  </dialog>
</body>
</html>
